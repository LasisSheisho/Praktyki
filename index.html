<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>CityGrid</title>
<style>
  /* Ogólny wygląd strony: ciemne tło, biały tekst */
  body { margin: 0; font-family: Arial, sans-serif; background: #222; color: #fff; }
  /* Górny pasek: pusta kolumna - tytuł na środku - panel logowania po prawej */
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #111; padding: 8px 16px; }
  #top h1 { margin: 0; }
  #auth { text-align: right; }
  #auth input { width: 90px; }
  /* Komunikat o błędzie (czerwony) pod polami logowania */
  #msg { color: #f88; font-size: 12px; height: 14px; }
  /* Główny obszar: lewy panel, mapa i prawy panel obok siebie, wyśrodkowane */
  #main { display: flex; justify-content: center; gap: 12px; padding: 12px; }
  .panel { background: #333; padding: 10px; width: 220px; height: fit-content; }
  .panel h3 { margin: 0 0 8px; }
  .panel ol { padding-left: 20px; margin: 0; }
  /* Mapa gry */
  canvas { background: #000; cursor: crosshair; display: block; flex: none; }
  /* Przyciski wyboru budynków; .sel to aktualnie wybrany */
  .tool { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 4px; padding: 4px; cursor: pointer; text-align: left; }
  .tool img { width: 28px; height: 28px; }
  .tool.sel { background: #fc3; }
  /* Statystyki i podpowiedzi pod listą budynków */
  #stats { margin-top: 10px; font-size: 14px; line-height: 1.6; }
  #info { font-size: 12px; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>

<!-- Górny pasek z tytułem i logowaniem -->
<div id="top">
  <div></div>
  <h1>CityGrid</h1>
  <div id="auth">
    <!-- Widoczne, gdy nikt nie jest zalogowany -->
    <span id="guest">
      <input id="u" placeholder="Nick"> <input id="p" type="password" placeholder="Hasło">
      <button onclick="auth('login')">Zaloguj</button>
      <button onclick="auth('register')">Rejestracja</button>
    </span>
    <!-- Widoczne po zalogowaniu: nick i przycisk wylogowania -->
    <span id="logged" hidden><b id="name"></b> <button onclick="logout()">Wyloguj</button></span>
    <div id="msg"></div>
  </div>
</div>

<div id="main">
  <!-- Lewy panel: ranking graczy (wypełniany przez js/api.js) -->
  <div class="panel">
    <h3>Leaderboard</h3>
    <ol id="lb"></ol>
  </div>

  <!-- Mapa gry (rysowana przez js/render.js) -->
  <canvas id="map"></canvas>

  <!-- Prawy panel: lista budynków, statystyki i podpowiedzi -->
  <div class="panel">
    <h3>Budynki</h3>
    <div id="tools"></div>   <!-- przyciski budynków dodaje js/toolbar.js -->
    <div id="stats"></div>   <!-- statystyki wypełnia js/render.js -->
    <div id="info">
      Piasek: +10% wody.<br>
      Bagno: -10% ludzi / zarobków.<br>
      Praca na ciemnej trawie: +10% zarobków.<br>
    </div>
  </div>
</div>

<!-- Skrypty gry. Kolejność ma znaczenie: każdy plik korzysta z poprzednich -->
<script src="js/config.js"></script>   <!-- stałe, budynki, mapa -->
<script src="js/game.js"></script>     <!-- stan gry i logika -->
<script src="js/render.js"></script>   <!-- rysowanie -->
<script src="js/toolbar.js"></script>  <!-- panel budynków -->
<script src="js/input.js"></script>    <!-- obsługa myszy -->
<script src="js/api.js"></script>      <!-- komunikacja z api.php -->
<script src="js/main.js"></script>     <!-- start gry -->
</body>
</html>
