<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityGrid - Gra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mapId = params.get('map');

    const IMAGES = { jeziora: '333.png', rzeka: '222.png', wybrzeze: '111.png' };

    document.getElementById('game').innerHTML =
      '<h1>Mapa: ' + mapId + '</h1><img src="' + IMAGES[mapId] + '" width="512">';
  </script>
</body>
</html>
